<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking stream</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <h1>Tracking stream</h1>
  <p id="status">Loading...</p>

  <div class="controls">
    <label>Camera: <select id="cameraSelect"></select></label>
    <label>Sensor mode: <select id="modeSelect"></select></label>
  </div>
  <div class="controls">
    <label>Model: <select id="modelSelect"></select></label>
    <label>FPS: <input type="number" id="fpsInput" min="1" max="60" step="1" style="width:4em"></label>
    <label>Confidence: <input type="number" id="confInput" min="0" max="1" step="0.05" style="width:4em"></label>
  </div>
  <div class="controls">
    <label>Classes: <select id="classesSelect" multiple size="3"></select></label>
    <small>(hold Ctrl/Cmd to select multiple; empty = all)</small>
  </div>
  <div class="controls">
    <button id="startBtn" disabled>Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <script src="/static/js/stream.js"></script>
  <script>
    streamPage({
      wsPath: "/ws-tracking",
      loadModel: { url: "/tracking/load-model", readyText: "Ready. Click Start." },
      optionsUrl: "/tracking/options",
    });
  </script>
</body>
</html>
